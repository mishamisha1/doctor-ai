package agent

import (
	"encoding/json"
	"os"
)

type Policy struct {
	QuarantinePaths []string `json:"quarantinePaths"`
}

func LoadPolicy(path string) (*Policy, error) {
	b, err := os.ReadFile(path)
	if err != nil {
		return nil, err
	}
	var p Policy
	if err := json.Unmarshal(b, &p); err != nil {
		return nil, err
	}
	return &p, nil
}
